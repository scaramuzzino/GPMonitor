name: gpmon

services:
  gpmon:
    build: .
    image: gpmon:latest
    container_name: gpmon
    # host network: il container raggiunge i target con gli IP/rotte dell'host
    network_mode: host
    restart: unless-stopped
    # NET_RAW/NET_ADMIN: servono a nmap per SYN scan (-sS) e OS detection (-O)
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      # nome=utente@host per ogni server da monitorare (host = IP o hostname raggiungibile in SSH).
      # Puoi anche lasciarlo vuoto e aggiungere i server dalla dashboard (Config).
      MON_HOSTS: "srv1=root@10.0.0.1,srv2=user@10.0.0.2"
      # indirizzo:porta su cui esporre la web. Tienila su rete fidata (loopback/VPN/Tailscale):
      # NON esporla direttamente su internet (evita 0.0.0.0 su IP pubblici).
      MON_BIND: "127.0.0.1:8888"
      MON_INTERVAL: "15"
      MON_RETENTION_HOURS: "48"
      # scansione nmap (agentless): rescan automatico + on-demand dal drawer
      MON_NMAP: "1"
      MON_NMAP_INTERVAL_HOURS: "6"
      MON_NMAP_TOP_PORTS: "1000"
      # profondità piena: -p- (tutte le 65535 porte). 0 = solo le top-ports.
      MON_NMAP_DEEP: "0"
      # correlazione CVE via NSE vulners (CPE->CVE). NB: interroga vulners.com (uscita internet):
      # con 1 NON è più 100% on-premise. Toggle anche da Config, persistito in kv['nmap_vuln'].
      MON_NMAP_VULN: "0"
      # tetto CVE per porta: 0 = nessun tetto (conteggi onesti)
      MON_NMAP_VULN_CAP: "0"
      # destinatario di report/avvisi email (modificabile anche da Config)
      MON_REPORT_EMAIL: ""
      MON_SSH_KEY: "/app/ssh/monitor_ed25519"
      MON_DATA_DIR: "/app/data"
    volumes:
      - ./ssh:/app/ssh:ro     # chiave privata di monitoraggio (sola lettura)
      - ./data:/app/data      # SQLite + known_hosts (persistente)
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

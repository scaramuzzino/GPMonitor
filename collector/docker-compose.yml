name: gpmon

services:
  gpmon:
    build: .
    image: gpmon:latest
    container_name: gpmon
    # host network: il container raggiunge i target con gli IP/rotte dell'host
    network_mode: host
    restart: unless-stopped
    # NET_RAW/NET_ADMIN: servono a nmap per SYN scan (-sS) e OS detection (-O)
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # I valori vengono da .env (nella stessa cartella) con default sensati.
    # Copia .env.example in .env e personalizza: .env NON va committato.
    environment:
      MON_HOSTS: "${MON_HOSTS:-}"
      MON_BIND: "${MON_BIND:-127.0.0.1:8888}"
      MON_INTERVAL: "${MON_INTERVAL:-15}"
      MON_RETENTION_HOURS: "${MON_RETENTION_HOURS:-48}"
      MON_SECURITY_RETENTION_HOURS: "${MON_SECURITY_RETENTION_HOURS:-48}"
      MON_NMAP: "${MON_NMAP:-1}"
      MON_NMAP_INTERVAL_HOURS: "${MON_NMAP_INTERVAL_HOURS:-6}"
      MON_NMAP_TOP_PORTS: "${MON_NMAP_TOP_PORTS:-1000}"
      MON_NMAP_DEEP: "${MON_NMAP_DEEP:-0}"
      MON_NMAP_VULN: "${MON_NMAP_VULN:-0}"
      MON_NMAP_VULN_CAP: "${MON_NMAP_VULN_CAP:-0}"
      MON_REPORT_EMAIL: "${MON_REPORT_EMAIL:-}"
      MON_SSH_KEY: "/app/ssh/monitor_ed25519"
      MON_DATA_DIR: "/app/data"
    volumes:
      - ./ssh:/app/ssh:ro     # chiave privata di monitoraggio (sola lettura)
      - ./data:/app/data      # SQLite + known_hosts (persistente)
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
